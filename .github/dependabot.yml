version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron-forge:
        patterns:
          - '@electron-forge/*'
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
      webdriverio:
        patterns:
          - '@wdio/*'

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      playwright:
        patterns:
          - '@playwright/test'
          - '@axe-core/playwright'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
