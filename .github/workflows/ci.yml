name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the pinned mangabind/mangapress binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain.lock.json') }}
      # A step that only downloads has a limit of its own: when the runner's network stalls, it would
      # otherwise hold the whole job until the job's limit (30 minutes) cancels it.
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: Install Chromium
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: npx playwright install chromium chromium-headless-shell
      - run: npm run check

  visual-regression:
    name: Storybook visual regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install chromium
      - run: npm run test:visual
      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-visual-diff
          path: test-results/
          if-no-files-found: ignore

  packaged-shell:
    name: Packaged shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the pinned mangabind/mangapress binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain.lock.json') }}
      - run: npm run package:e2e
      - run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-shell-${{ runner.os }}
          path: |
            test-results/
            *.log
          if-no-files-found: ignore

  make-verification:
    name: Make installer
    # Shared with release.yml's build job - see make.yml for why this stopped being two copies.
    uses: ./.github/workflows/make.yml
    with:
      artifact-name-prefix: make-
      run-sandbox-diagnostic: true

  arch-package-verification:
    name: Make Arch package
    # Shared with release.yml - see arch-package.yml.
    uses: ./.github/workflows/arch-package.yml
    with:
      artifact-name: arch-package
      run-sandbox-diagnostic: true

  wayland-shell:
    name: Packaged shell (Wayland)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the pinned mangabind/mangapress binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain.lock.json') }}
      # Only the shell spec runs here, against the packaged Electron app, and the packaged-shell job
      # above runs that same app on this runner image with nothing installed: no Playwright browser
      # and none of its system libraries are needed. Everything this job downloads is time spent on
      # the runner's network, which is where it has been slow; weston alone is about a hundred
      # packages, so it is installed without the recommended ones.
      - name: Install weston
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends weston
      - run: npm run package
      - name: Run the packaged shell in headless Wayland
        shell: bash
        run: .github/scripts/run-wayland-smoke.sh
