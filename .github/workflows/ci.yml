name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium chromium-headless-shell
      - run: npm run check

  visual-regression:
    name: Storybook visual regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-visual-diff
          path: test-results/
          if-no-files-found: ignore

  packaged-shell:
    name: Packaged shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:e2e
      - run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-shell-${{ runner.os }}
          path: |
            test-results/
            *.log
          if-no-files-found: ignore

  make-verification:
    name: Make installer (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-latest
            runner: windows-latest
          - name: ubuntu-latest
            runner: ubuntu-latest
          # Pinned, not macos-latest: that alias has already moved from Intel to Apple Silicon
          # once, silently, and this repo ships arm64-only for the alpha. A fixed, non-deprecated
          # label keeps the architecture an explicit choice, not a default that drifts whenever
          # GitHub repoints -latest.
          - name: macos-15-arm64
            runner: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        # MakerRpm needs the `rpmbuild` binary (apt's `rpm` package provides it on
        # Debian/Ubuntu - there is no separate "rpmbuild" package there); MakerDeb needs
        # `dpkg` (already present on any Debian-family runner) and `fakeroot`.
        run: sudo apt-get update && sudo apt-get install --yes rpm fakeroot
      - run: npm run make
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: make-${{ matrix.name }}
          path: out/make/**
          if-no-files-found: error
      - name: 'Diagnostic: launch the real .deb with the sandbox enabled'
        if: runner.os == 'Linux'
        # Not a release gate (always exits 0) - purely to observe and record real behavior before
        # anyone documents a workaround for a problem that might not even apply here. Every other
        # Electron launch in this repo's CI runs with --no-sandbox (see wdio.conf.ts); this is the
        # one place that deliberately does not, so the result reflects what a real user gets.
        shell: bash
        run: .github/scripts/check-deb-sandbox.sh

  wayland-shell:
    name: Packaged shell (Wayland)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --yes weston
      - run: npm run package
      - name: Run the packaged shell in headless Wayland
        shell: bash
        run: .github/scripts/run-wayland-smoke.sh
