name: Toolchain update

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Propose ${{ matrix.tool }} pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: [mangabind, mangapress]
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.TOOLCHAIN_BOT_APP_ID }}
          private-key: ${{ secrets.TOOLCHAIN_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build pins from the latest upstream releases
        run: >-
          node scripts/update-toolchain-lock.mjs
          --tool "${{ matrix.tool }}"
          --write
          --pr-body "${{ runner.temp }}/toolchain-pr.md"
      - name: Validate and execute the host binaries
        run: |
          npm run toolchain:check
          npm run toolchain:acquire
      - name: Open or refresh the toolchain pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: ${{ runner.temp }}/toolchain-pr.md
          TOOL_NAME: ${{ matrix.tool }}
        shell: bash
        run: |
          if git diff --quiet -- toolchain.lock.json; then
            echo "Toolchain pins are already current."
            exit 0
          fi

          branch="automation/toolchain-$TOOL_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add toolchain.lock.json
          git commit -m "chore: update bundled $TOOL_NAME pin"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title "chore: update bundled $TOOL_NAME pin" \
              --body-file "$PR_BODY"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update bundled $TOOL_NAME pin" \
              --body-file "$PR_BODY"
          fi
